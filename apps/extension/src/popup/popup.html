<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeeTrack</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="text-sm font-sans bg-[var(--color-bg)] text-[var(--color-text)]">
    <div id="app" class="w-[400px] min-h-screen">
      <!-- Auth Screen -->
      <div id="auth-screen" class="screen p-4">
        <div class="mb-6 pb-3 border-b divider">
          <h2 class="text-xl font-bold">LeeTrack</h2>
          <p class="text-xs text-muted mt-1">Track LeetCode collaboratively</p>
        </div>

        <form id="login-form" class="mb-4">
          <div class="mb-3 flex flex-col">
            <label for="username" class="font-semibold mb-1.5"> Username </label>
            <input
              type="text"
              id="username"
              placeholder="Enter username"
              class="input"
              required
            />
          </div>

          <div class="mb-4 flex flex-col">
            <label for="password" class="font-semibold mb-1.5"> Password </label>
            <input
              type="password"
              id="password"
              placeholder="Enter password"
              class="input"
              required
            />
          </div>

          <button
            type="submit"
            id="login-btn"
            class="btn-primary mb-2"
          >
            Sign In
          </button>
        </form>

        <p class="text-center text-xs text-muted mt-3">
          No account yet?
          <a href="#" id="register-link" class="font-semibold hover:underline" style="color: var(--color-primary)">
            Create one
          </a>
        </p>
      </div>

      <!-- Main Screen (After Auth) -->
      <div id="main-screen" class="screen hidden p-4">
        <div class="mb-5 pb-3 border-b divider flex justify-between items-center">
          <h3 class="text-lg font-bold">LeeTrack</h3>
          <button
            id="settings-btn"
            class="text-lg p-1 rounded-lg hover:bg-[var(--color-surface)] transition-colors"
            title="Settings"
          >
            ⚙️
          </button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="card-muted">
            <span class="text-xs text-muted font-semibold">Status</span>
            <span id="sync-status" class="text-sm font-semibold text-success"> ✓ Synced </span>
          </div>
          <div class="card-muted">
            <span class="text-xs text-muted font-semibold">Pending</span>
            <span id="pending-count" class="text-sm font-semibold text-warning"> 0 </span>
          </div>
        </div>

        <button
          id="sync-btn"
          class="btn-secondary mb-4"
        >
          Sync Submissions
        </button>

        <div class="mb-4">
          <h4 class="text-sm font-semibold mb-2">Recent Submissions</h4>
          <div id="submissions-list" class="max-h-52 overflow-y-auto space-y-2"></div>
        </div>

        <button
          id="logout-btn"
          class="btn-danger"
        >
          Sign Out
        </button>
      </div>

      <!-- Settings Screen -->
      <div id="settings-screen" class="screen hidden p-4">
        <div class="mb-6 pb-3 border-b divider">
          <h3 class="text-lg font-bold">Settings</h3>
        </div>

        <div class="mb-4">
          <div class="mb-3 flex flex-col">
            <label for="api-url" class="font-semibold mb-1.5"> API URL </label>
            <input
              type="text"
              id="api-url"
              placeholder="http://localhost:3000"
              class="input"
            />
          </div>

          <button
            id="save-settings-btn"
            class="btn-primary mb-2"
          >
            Save Settings
          </button>
          <button
            id="back-settings-btn"
            class="btn-secondary"
          >
            Back
          </button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
