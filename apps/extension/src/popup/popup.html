<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeeTrack</title>
  </head>
  <body class="bg-white text-gray-900 text-sm font-sans">
    <div id="app" class="w-[400px] min-h-screen bg-white">
      <!-- Auth Screen -->
      <div id="auth-screen" class="screen p-4">
        <div class="mb-6 pb-3 border-b border-gray-200">
          <h2 class="text-xl font-bold">LeeTrack</h2>
          <p class="text-xs text-gray-600 mt-1">Track LeetCode collaboratively</p>
        </div>

        <form id="login-form" class="mb-4">
          <div class="mb-3 flex flex-col">
            <label for="username" class="font-semibold mb-1.5 text-gray-900"> Username </label>
            <input
              type="text"
              id="username"
              placeholder="Enter username"
              class="px-3 py-2.5 border border-gray-300 rounded-lg text-sm font-sans focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required
            />
          </div>

          <div class="mb-4 flex flex-col">
            <label for="password" class="font-semibold mb-1.5 text-gray-900"> Password </label>
            <input
              type="password"
              id="password"
              placeholder="Enter password"
              class="px-3 py-2.5 border border-gray-300 rounded-lg text-sm font-sans focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required
            />
          </div>

          <button
            type="submit"
            id="login-btn"
            class="w-full px-4 py-2.5 bg-blue-500 text-white rounded-lg font-semibold hover:bg-blue-600 active:scale-95 transition-all duration-150 mb-2"
          >
            Sign In
          </button>
        </form>

        <p class="text-center text-xs text-gray-600 mt-3">
          No account yet?
          <a href="#" id="register-link" class="text-blue-500 font-semibold hover:underline">
            Create one
          </a>
        </p>
      </div>

      <!-- Main Screen (After Auth) -->
      <div id="main-screen" class="screen hidden p-4">
        <div class="mb-5 pb-3 border-b border-gray-200 flex justify-between items-center">
          <h3 class="text-lg font-bold">LeeTrack</h3>
          <button
            id="settings-btn"
            class="text-lg p-1 rounded-lg hover:bg-gray-100 transition-colors"
            title="Settings"
          >
            ⚙️
          </button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="bg-gray-50 p-3 rounded-lg flex flex-col gap-1.5">
            <span class="text-xs text-gray-600 font-semibold">Status</span>
            <span id="sync-status" class="text-sm font-semibold text-green-600"> ✓ Synced </span>
          </div>
          <div class="bg-gray-50 p-3 rounded-lg flex flex-col gap-1.5">
            <span class="text-xs text-gray-600 font-semibold">Pending</span>
            <span id="pending-count" class="text-sm font-semibold text-amber-500"> 0 </span>
          </div>
        </div>

        <button
          id="sync-btn"
          class="w-full px-4 py-2 bg-gray-100 text-gray-900 rounded-lg font-semibold border border-gray-300 hover:bg-gray-200 active:scale-95 transition-all duration-150 mb-4"
        >
          Sync Submissions
        </button>

        <div class="mb-4">
          <h4 class="text-sm font-semibold mb-2 text-gray-900">Recent Submissions</h4>
          <div id="submissions-list" class="max-h-52 overflow-y-auto space-y-2"></div>
        </div>

        <button
          id="logout-btn"
          class="w-full px-4 py-2 bg-red-500 text-white rounded-lg font-semibold hover:bg-red-600 active:scale-95 transition-all duration-150"
        >
          Sign Out
        </button>
      </div>

      <!-- Settings Screen -->
      <div id="settings-screen" class="screen hidden p-4">
        <div class="mb-6 pb-3 border-b border-gray-200">
          <h3 class="text-lg font-bold">Settings</h3>
        </div>

        <div class="mb-4">
          <div class="mb-3 flex flex-col">
            <label for="api-url" class="font-semibold mb-1.5 text-gray-900"> API URL </label>
            <input
              type="text"
              id="api-url"
              placeholder="http://localhost:3000"
              class="px-3 py-2.5 border border-gray-300 rounded-lg text-sm font-sans focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>

          <button
            id="save-settings-btn"
            class="w-full px-4 py-2 bg-blue-500 text-white rounded-lg font-semibold hover:bg-blue-600 active:scale-95 transition-all duration-150 mb-2"
          >
            Save Settings
          </button>
          <button
            id="back-settings-btn"
            class="w-full px-4 py-2 bg-gray-100 text-gray-900 rounded-lg font-semibold border border-gray-300 hover:bg-gray-200 active:scale-95 transition-all duration-150"
          >
            Back
          </button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
