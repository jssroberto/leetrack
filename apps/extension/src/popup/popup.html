<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeeTrack</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="text-sm font-sans bg-[var(--color-bg)] text-[var(--color-text)]">
    <div id="app" class="w-[400px] min-h-screen">
      <!-- Toast -->
      <div id="toast" class="toast hidden" role="status" aria-live="polite">
        <span id="toast-text"></span>
        <button
          id="toast-close"
          title="Close"
          class="ml-2 text-muted hover:text-[var(--color-text)]"
        >
          ✕
        </button>
      </div>
      <!-- Auth Screen -->
      <div id="auth-screen" class="screen p-4">
        <div class="mb-6 pb-3 border-b divider">
          <h2 class="text-xl font-bold">LeeTrack</h2>
          <p class="text-xs text-muted mt-1">Track LeetCode collaboratively</p>
        </div>

        <form id="login-form" class="mb-4">
          <div class="mb-3 flex flex-col">
            <label for="email" class="font-semibold mb-1.5"> Email </label>
            <input type="text" id="email" placeholder="Enter email" class="input" required />
          </div>

          <div class="mb-4 flex flex-col">
            <label for="password" class="font-semibold mb-1.5"> Password </label>
            <input
              type="password"
              id="password"
              placeholder="Enter password"
              class="input"
              required
            />
          </div>

          <div id="login-error" class="text-xs text-red-500 mb-3 hidden"></div>

          <button type="submit" id="login-btn" class="btn-primary mb-2">Sign In</button>
        </form>

        <p class="text-center text-xs text-muted mt-3">
          No account yet?
          <a
            href="#"
            id="register-link"
            class="font-semibold hover:underline"
            style="color: var(--color-primary)"
          >
            Create one
          </a>
        </p>
      </div>

      <!-- Main Screen (After Auth) -->
      <div id="main-screen" class="screen hidden p-4">
        <div class="mb-5 pb-3 border-b divider flex justify-between items-center">
          <h3 class="text-lg font-bold">LeeTrack</h3>
        </div>

        <div class="mb-4">
          <h4 class="text-sm font-semibold mb-2">Recent Submissions</h4>
          <div id="submissions-list" class="max-h-52 overflow-y-auto space-y-2"></div>
        </div>

        <button id="logout-btn" class="btn-danger">Sign Out</button>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
