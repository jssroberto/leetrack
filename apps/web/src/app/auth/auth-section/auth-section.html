<section class="flex flex-col gap-[3vh]">
  <header class="flex flex-col gap-2">
    <h1 class="text-[var(--light)] text-[clamp(2rem,3vw,3rem)] font-family-roboto-slab-bold">
      {{ title }}
    </h1>
    <p class="text-[var(--gray)] text-base">
      {{ text }}
      <a class="text-[var(--secondary-color)] underline" href="{{ link }}">{{ textLink }}</a>
    </p>
  </header>
  <hr class="text-[var(--gray)]" />
  <ng-content></ng-content>
</section>
