<app-auth-section
  [title]="'Login'"
  [text]="`Don't have an account?`"
  [textLink]="'Sign up'"
  [link]="'register'"
>
  <form action="" class="flex flex-col gap-[3vh]">
    <input
      type="text"
      placeholder="Enter your email"
      class="focus:border-[var(--secondary-color)] border-1 border-transparent transition-all duration-200 outline-none shadow-[0_6px_6px_var(--shadow)] bg-[var(--dark)] placeholder:text-[var(--gray)] text-[var(--gray)] rounded-md px-5 py-4 text-sm"
    />
    <input
      type="text"
      placeholder="Enter your password"
      class="focus:border-[var(--secondary-color)] border-1 border-transparent transition-all duration-200 outline-none shadow-[0_6px_6px_var(--shadow)] bg-[var(--dark)] placeholder:text-[var(--gray)] text-[var(--gray)] rounded-md px-5 py-4 text-sm"
    />
    <button
      type="submit"
      class="cursor-pointer transition-all duration-200 hover:bg-[var(--secondary-hover)] bg-[var(--secondary-color)] py-4 rounded-md font-family-roboto-slab-bold text-[var(--light)]"
    >
      Continue
    </button>
  </form>
</app-auth-section>
