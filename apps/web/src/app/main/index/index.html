<main class="flex justify-center items-center h-full gap-[5vw] w-full">
    <div class="w-full flex flex-col justify-center gap-[3vh]">
        <div class="flex flex-col gap-2">
            <h1
                class="text-center sm:text-start text-[var(--light)] text-[clamp(2rem,2vw,3rem)] font-family-roboto-slab-bold">
                It's looking a
                little empty here...</h1>
            <p class="text-center sm:text-start text-[var(--gray)] text-base">Be the first to bring this page to
                life!</p>
        </div>
        <div class="flex flex-col gap-2">
            <button
                class="shadow-[0_6px_6px_var(--shadow)] cursor-pointer transition-all duration-200 hover:bg-[var(--secondary-hover)] bg-[var(--secondary-color)] py-4 rounded-md font-family-roboto-slab-bold text-[var(--light)] w-full">Create
                a group</button>
            <button
                class="cursor-pointer transition-all duration-200 hover:bg-[var(--dark)] py-4 rounded-md font-family-roboto-slab text-[var(--light)] w-auto">Join
                group</button>
        </div>
    </div>
    <div class="hidden md:flex w-full justify-center">
        <img src="/assets/svgs/looking-empty.svg" alt="" class="w-[70%]" />
    </div>
</main>
