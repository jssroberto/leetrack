<!-- Flex flex-col to use flex-1 -->
<div class="w-screen h-screen flex flex-col p-[3vw] overflow-hidden gap-8">
    <nav class="grid grid-cols-3 w-full h-auto items-center">
        <div class="flex gap-1 items-center text-[var(--secondary-color)] cursor-pointer" (click)="navigateTo('index')">
            <span class="font-family-roboto-slab-bold">Leetrack</span>
            <img src="/assets/icon/leetrack-icon-transparent.png" alt="" draggable="false" class="w-7" />
        </div>
        <div class="text-[var(--light)] flex items-center h-full justify-center">
            <ul class="flex gap-[3vw] items-center justify-center text-sm">
                @if (showMenuOptions()) {
                <li class="underline-offset-4 hover:underline hover:text-[var(--secondary-color)] cursor-pointer"
                    (click)="navigateTo('leaderboard')" [ngClass]="{
                        'underline text-[var(--secondary-color)]': currentRoute() === ('/main/leaderboard')
                     }">
                    Leaderboard</li>
                <li class="underline-offset-4 hover:underline hover:text-[var(--secondary-color)] cursor-pointer"
                    (click)="navigateTo('log')" [ngClass]="{
                        'underline text-[var(--secondary-color)]': currentRoute() === ('/main/log')
                     }">
                    Log</li>
                <li class="underline-offset-4 hover:underline hover:text-[var(--secondary-color)] cursor-pointer"
                    (click)="navigateTo('problems')" [ngClass]="{
                    'underline text-[var(--secondary-color)]': currentRoute().startsWith('/main/problems')
                    }">
                    Problems
                </li>
                <li class="underline-offset-4 hover:underline hover:text-[var(--secondary-color)] cursor-pointer"
                    (click)="navigateTo('settings')" [ngClass]="{
                        'underline text-[var(--secondary-color)]': currentRoute() === '/main/settings'
                     }">
                    Settings</li>
                }
                <li class="text-nowrap underline-offset-4 hover:underline hover:text-[var(--secondary-color)] cursor-pointer"
                    (click)="logout()">
                    Log Out</li>
            </ul>
        </div>
        <div class="flex text-[var(--light)] cursor-pointer items-center justify-end gap-4">
            <div class="flex gap-2 items-center relative left-3">
                <span class="font-family-roboto-slab">{{ user()?.leetcodeUsername || user()?.email }}</span>
                <div class="bg-[var(--secondary-color)] rounded-4xl flex justify-center items-center size-8 z-1">
                    <!-- Margin right depends on level digits -->
                    <img src="/assets/svgs/user-icon.svg" alt="" draggable="false" />
                </div>
            </div>
        </div>
    </nav>

    <!-- main content -->
    <!-- is the overflow the best practice? i suppose, looks good -->
    <div class="h-full flex-1 overflow-hidden">
        <router-outlet></router-outlet>
    </div>
</div>
