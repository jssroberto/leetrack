<!-- Flex flex-col to use flex-1 -->
<div class="w-screen h-screen flex flex-col p-[3vw] overflow-hidden gap-8">
    <nav class="flex justify-between w-full h-auto items-center">
        <div class="flex gap-1 items-center text-[var(--secondary-color)] cursor-pointer">
            <span class="font-family-roboto-slab-bold">Leetrack</span>
            <img src="/assets/icon/logo.svg" alt="" draggable="false" />
        </div>
        @if (showMenuOptions()) {
        <div class="text-[var(--light)] flex items-center h-full">
            <ul class="flex gap-[3vw] items-center text-sm">
                <li class="underline-offset-4 hover:underline hover:text-[var(--secondary-color)] cursor-pointer"
                    (click)="navigateTo('dashboard')" [ngClass]="{
                        'underline text-[var(--secondary-color)]': currentRouteValue === '/main/dashboard'
                     }">
                    Dashboard</li>
                <li class="hover:underline-offset-4 hover:underline hover:text-[var(--secondary-color)] cursor-pointer"
                    (click)="navigateTo('leaderboard')" [ngClass]="{
                        'underline text-[var(--secondary-color)]': currentRouteValue === '/main/leaderboard'
                     }">
                    Leaderboard</li>
                <li class="hover:underline-offset-4 hover:underline hover:text-[var(--secondary-color)] cursor-pointer"
                    (click)="navigateTo('log')" [ngClass]="{
                        'underline text-[var(--secondary-color)]': currentRouteValue === '/main/log'
                     }">
                    Log</li>
                <li class="hover:underline-offset-4 hover:underline hover:text-[var(--secondary-color)] cursor-pointer"
                    (click)="navigateTo('polling')" [ngClass]="{
                        'underline text-[var(--secondary-color)]': currentRouteValue === '/main/polling'
                     }">
                    Polling</li>
                <li class="hover:underline-offset-4 hover:underline hover:text-[var(--secondary-color)] cursor-pointer"
                    (click)="navigateTo('settings')" [ngClass]="{
                        'underline text-[var(--secondary-color)]': currentRouteValue === '/main/settings'
                     }">
                    Settings</li>
                <li class="hover:underline-offset-4 hover:underline hover:text-[var(--secondary-color)] cursor-pointer"
                    (click)="navigateTo('groups')" [ngClass]="{
                        'underline text-[var(--secondary-color)]': currentRouteValue === '/main/groups'
                     }">
                    Groups</li>
            </ul>
        </div>
        }
        <div class="flex text-[var(--light)] cursor-pointer items-center">
            <div class="flex gap-2 items-center relative left-3">
                <span class="font-family-roboto-slab">User</span>
                <div class="bg-[var(--secondary-color)] rounded-4xl flex justify-center items-center size-8 z-1">
                    <!-- Margin right depends on level digits -->
                    <img src="/assets/svgs/user-icon.svg" alt="" draggable="false" />
                </div>
            </div>
            <div class="relative w-[4rem] h-[30px]">
                <!-- To do, later -->
                <svg viewBox="0 0 44 18" class="absolute inset-0 w-full h-full">
                    <path
                        d="M43.042 0.00253209C43.4463 0.00255888 43.6834 0.457431 43.4519 0.788854L37.9147 8.7159C37.7946 8.88786 37.7946 9.11651 37.9147 9.28849L43.4508 17.2163C43.6822 17.5477 43.4451 18.0026 43.0408 18.0025L4.88877 18C3.59215 17.9999 2.34866 17.7289 1.43185 17.2466C0.515038 16.7643 3.15179e-06 16.1102 4.83501e-05 15.4283L0.000900452 2.57111C0.00094565 1.88912 0.516067 1.23511 1.43294 0.752929C2.34982 0.270753 3.59335 -8.2358e-05 4.88996 3.57456e-06L43.042 0.00253209Z"
                        fill="#3B3B3B" />
                </svg>
                <span class="absolute inset-0 flex items-center justify-center">17</span>
            </div>
        </div>
    </nav>
    <!-- main content -->
    <div class="h-full">
        <router-outlet></router-outlet>
    </div>
</div>
