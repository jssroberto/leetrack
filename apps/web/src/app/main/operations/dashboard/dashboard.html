<main class="w-full h-full text-[var(--light)] flex flex-col gap-4">
    <div class="w-full flex justify-between">
        <h1
            class="text-center sm:text-start text-[var(--light)] text-[clamp(2rem,2vw,3rem)] font-family-roboto-slab-bold">
            Dashboard</h1>
        <div class="flex items-center gap-3">
            <div
                class="cursor-pointer hover:bg-[var(--dark-gray)] w-auto bg-[var(--dark)] whitespace-nowrap rounded-md shadow-[0_6px_6px_var(--shadow)] h-auto px-4">
                <h2 class="text-[clamp(2rem,2vw,3rem)] font-family-roboto-slab-bold">ITSON</h2>
            </div>
            <app-basic-card [iconName]="'chevronDown'" [color]="'var(--light)'" class="w-full h-full"
                [size]="'32'"></app-basic-card>
        </div>
    </div>
    <h2 class="text-lg">
        This week problems
    </h2>
    <hr class="text-[var(--gray)]">
    <div class="grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-3 gap-3">
        <div class="flex gap-3 flex-1 lg:min-w-auto min-w-[100px]">
            <app-basic-card [color]="'var(--secondary-color)'"
                [title]="'Longest Substring Without Repeating Characters'" [number]="'1'"
                class="w-full min-w-0"></app-basic-card>
            <app-basic-card [color]="'var(--secondary-color)'" [title]="'Completed in 54:43:10'"
                class="w-auto"></app-basic-card>
            <app-basic-card [title]="'Hard'" [color]="'var(--red)'"></app-basic-card>
            <app-basic-card [title]="'+50 XP'" [color]="'var(--pink)'"></app-basic-card>
