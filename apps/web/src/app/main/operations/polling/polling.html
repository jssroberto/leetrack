<main class="w-full h-full text-[var(--light)] flex flex-col gap-4">
    <app-main-title class="flex flex-col" [title]="'Polling'" [subTitle]="'Active poll'"></app-main-title>

    <div class="grid grid-cols-[repeat(auto-fit,minmax(500px,1fr))] gap-3">
        <app-voting-basic-card [rank]="'1'" [user]="'edtarsz'"
            [problem]="'Longest Substring Without Repeating Characters'" [number]="'4'" [difficulty]="'Hard'"
            [votes]="'25 votes'"></app-voting-basic-card>

        <app-voting-basic-card [rank]="'1'" [user]="'edtarsz'"
            [problem]="'Longest Substring Without Repeating Characters'" [number]="'4'" [difficulty]="'Hard'"
            [votes]="'25 votes'"></app-voting-basic-card>
    </div>

    <app-sub-title [subTitle]="'Problems'">
        <div class="flex gap-2 items-center px-4 shadow-[0_6px_6px_var(--shadow)] bg-[var(--dark)] rounded-full w-[20vw] min-w-[250px] 
            transition-all duration-200 
            focus-within:ring-1 focus-within:ring-[var(--secondary-color)]">

            <lucide-icon [img]="getIcon('search')" class="my-icon" [size]="'16'" [strokeWidth]="'2'"
                [color]="'var(--gray)'"></lucide-icon>

            <input type="search"
                class="bg-transparent focus:outline-none border-none text-xs py-3 text-[var(--gray)] w-full placeholder:text-[var(--gray)]"
                placeholder="Search problem">
        </div>
        <div>
            <ul class="flex gap-5 text-xs">
                <li class="cursor-pointer">
                    <div class="flex items-center gap-2">
                        <span>
                            Difficulty
                        </span>
                        <lucide-icon [img]="getIcon('minus')" class="my-icon" [size]="'16'"
                            [strokeWidth]="'2'"></lucide-icon>
                    </div>
                </li>
                <li class="cursor-pointer">
                    <div class="flex items-center gap-2">
                        <span>
                            Question ID
                        </span>
                        <lucide-icon [img]="getIcon('chevronUp')" class="my-icon" [size]="'16'"
                            [strokeWidth]="'2'"></lucide-icon>
                    </div>
                </li>
            </ul>
        </div>
    </app-sub-title>

</main>
