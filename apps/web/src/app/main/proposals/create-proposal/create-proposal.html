<main class="w-full h-full text-[var(--light)] flex flex-col gap-4">
  <div class="w-full flex justify-between flex-col">
    <div class="w-full flex justify-between">
      <h1
        class="text-center sm:text-start text-[var(--light)] text-[clamp(2rem,2vw,3rem)] font-family-roboto-slab-bold"
      >
        Create Proposal
      </h1>
    </div>
    <app-sub-title [subTitle]="'Propose a new challenge for your group'">
      <div></div>
      <h4 class="text-sm">
        <span
          routerLink="/main/group-content"
          class="hover:text-[var(--secondary-color)] cursor-pointer font-family-roboto-slab-bold underline"
        >
          Back to Group
        </span>
      </h4>
    </app-sub-title>
  </div>

  <div *ngIf="error" class="p-3 bg-red-500/20 border border-red-500 rounded text-red-200 text-sm">
    {{ error }}
  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="flex flex-col gap-6 max-w-2xl mx-auto w-full"
  >
    <!-- Category -->
    <div class="flex flex-col gap-2">
      <label for="category" class="text-sm font-bold text-[var(--gray)] uppercase tracking-wider">
        Category
      </label>
      <select
        id="category"
        formControlName="categoryId"
        class="w-full focus:border-[var(--secondary-color)] border-1 border-transparent transition-all duration-200 outline-none shadow-[0_6px_6px_var(--shadow)] bg-[var(--dark)] text-[var(--gray)] rounded-md px-5 py-4 text-sm appearance-none"
      >
        <option value="" disabled>Select a category</option>
        <option *ngFor="let category of categories" [value]="category.id">
          {{ category.name }}
        </option>
      </select>
    </div>

    <!-- Title -->
    <div class="flex flex-col gap-2">
      <label for="title" class="text-sm font-bold text-[var(--gray)] uppercase tracking-wider">
        Title (Optional)
      </label>
      <input
        type="text"
        id="title"
        formControlName="title"
        placeholder="e.g., Array Week"
        class="w-full focus:border-[var(--secondary-color)] border-1 border-transparent transition-all duration-200 outline-none shadow-[0_6px_6px_var(--shadow)] bg-[var(--dark)] placeholder:text-[var(--gray)] text-[var(--gray)] rounded-md px-5 py-4 text-sm"
      />
    </div>

    <!-- Description -->
    <div class="flex flex-col gap-2">
      <label
        for="description"
        class="text-sm font-bold text-[var(--gray)] uppercase tracking-wider"
      >
        Description (Optional)
      </label>
      <textarea
        id="description"
        formControlName="description"
        rows="3"
        placeholder="Briefly describe the focus of this challenge..."
        class="w-full focus:border-[var(--secondary-color)] border-1 border-transparent transition-all duration-200 outline-none shadow-[0_6px_6px_var(--shadow)] bg-[var(--dark)] placeholder:text-[var(--gray)] text-[var(--gray)] rounded-md px-5 py-4 text-sm"
      ></textarea>
    </div>

    <!-- Target Date -->
    <div class="flex flex-col gap-2">
      <label for="targetDate" class="text-sm font-bold text-[var(--gray)] uppercase tracking-wider">
        Target Date
      </label>
      <input
        type="date"
        id="targetDate"
        formControlName="targetDate"
        class="w-full focus:border-[var(--secondary-color)] border-1 border-transparent transition-all duration-200 outline-none shadow-[0_6px_6px_var(--shadow)] bg-[var(--dark)] text-[var(--gray)] rounded-md px-5 py-4 text-sm"
      />
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-end gap-3 mt-4">
      <a
        routerLink="/main/group-content"
        class="cursor-pointer px-6 py-3 rounded-md text-[var(--gray)] hover:bg-[var(--dark-gray)] hover:text-white transition-colors"
      >
        Cancel
      </a>
      <button
        type="submit"
        [disabled]="form.invalid || isLoading"
        class="cursor-pointer px-8 py-3 bg-[var(--secondary-color)] hover:bg-[var(--secondary-hover)] text-white rounded-md font-bold transition-colors shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ isLoading ? 'Creating...' : 'Create Proposal' }}
      </button>
    </div>
  </form>
</main>
