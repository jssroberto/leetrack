<div class="flex gap-3 flex-1 lg:min-w-auto min-w-[100px]">
    <app-basic-card [color]="'var(--secondary-color)'" [title]="problem" [number]="number"
        class="flex-1 min-w-0"></app-basic-card>
    <app-basic-card [color]="'var(--secondary-color)'" [title]="'Completed in ' + completedIn"></app-basic-card>

    <app-basic-card [title]="difficulty" [color]="difficultyColor"></app-basic-card>

    <app-basic-card [title]="'+' + xp + ' XP'" [color]="'var(--pink)'"></app-basic-card>
    <app-basic-card [iconName]="'squareArrowOutUpRight'" [size]="'18'" [color]="'var(--gray)'">
    </app-basic-card>
</div>
