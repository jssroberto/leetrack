<div
    class="flex-[1_1_400px] relative group bg-[var(--surface)] border border-[var(--dark-gray)] hover:border-[var(--secondary-color)] transition-all duration-300 rounded-md px-5 py-4 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-4">
        <div class="w-10 aspect-square rounded-full flex items-center justify-center text-white font-bold text-sm shadow-lg"
            [ngClass]="user.userId === currentUser?.id ? 'bg-gradient-to-br from-[var(--secondary-color)] to-orange-700' : 'bg-[#3B3B3B]'">
            {{ user.name.charAt(0).toUpperCase() }}
        </div>

        <div class="flex flex-col">
            <span class="text-[var(--light)] font-bold text-sm leading-none">
                {{ user.name }}
                @if (user.userId === currentUser?.id) { <span class="text-[var(--gray)] font-normal text-sm">(Tú)</span>
                }
            </span>
            <span class="text-xs font-bold mt-1 uppercase tracking-wide"
                [ngClass]="user.role.toString() === 'ADMIN' ? 'text-[var(--secondary-color)]' : 'text-[var(--gray)]'">
                {{ user.role }}
            </span>
        </div>
    </div>

    <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 p-2">
        <lucide-icon [img]="dots" class="my-icon cursor-pointer" [size]="'20'" [color]="'var(--light)'"
            [strokeWidth]="'3'"></lucide-icon>
    </div>
</div>
