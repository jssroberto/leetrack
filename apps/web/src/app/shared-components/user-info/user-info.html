<div
    class="user-card-wrapper flex-[1_1_400px] relative group bg-[var(--surface)] border border-[var(--dark-gray)] hover:border-[var(--secondary-color)] transition-all duration-300 rounded-md px-5 py-4 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-4">
        <div class="w-10 aspect-square rounded-full flex items-center justify-center text-white font-bold text-sm shadow-lg"
            [ngClass]="user.role.toString() === 'ADMIN' ? 'bg-gradient-to-br from-[var(--secondary-color)] to-orange-700' : 'bg-[#3B3B3B]'">
            {{ user.name.charAt(0).toUpperCase() }}
        </div>

        <div class="flex flex-col">
            <span class="text-[var(--light)] font-bold text-sm leading-none">
                {{ user.name }}
                @if (user.userId === currentUser()?.id) {
                <span class="text-[var(--gray)] font-normal text-sm">(Tú)</span>
                }
            </span>
            <span class="text-xs font-bold mt-1 uppercase tracking-wide"
                [ngClass]="user.role.toString() === 'ADMIN' ? 'text-[var(--secondary-color)]' : 'text-[var(--gray)]'">
                {{ user.role }}
            </span>
        </div>
    </div>

    <!-- Dots Menu Button -->
    <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-200">
        <button (click)="toggleMenu($event)" class="p-2 hover:bg-[var(--dark-gray)] rounded-md transition-all"
            [attr.aria-label]="'Menu for ' + user.name">
            <lucide-icon [img]="dots" class="my-icon cursor-pointer" [size]="'20'" [color]="'var(--light)'"
                [strokeWidth]="'3'">
            </lucide-icon>
        </button>
    </div>

    <!-- Popup Menu -->
    @if (showMenu()) {
    <div class="absolute right-0 top-full mt-2 bg-[var(--surface)] border border-[var(--dark-gray)] rounded-lg shadow-xl z-50 overflow-hidden min-w-[180px]"
        style="animation: slideIn 0.2s ease-out;">

        <!-- Kick Member Option (solo si no es el usuario actual y no es ADMIN) -->
        @if (user.userId !== currentUser()?.id && user.role.toString() !== 'ADMIN') {
        <button (click)="onKickMember()" [disabled]="isKicking()"
            class="w-full px-4 py-3 text-left text-[var(--red)] hover:bg-[var(--dark-gray)] transition-all duration-150 flex items-center gap-2 text-sm font-family-roboto-slab disabled:opacity-50 disabled:cursor-not-allowed">
            @if (isKicking()) {
            <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            <span>Kicking...</span>
            } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <line x1="17" y1="8" x2="22" y2="13"></line>
                <line x1="22" y1="8" x2="17" y2="13"></line>
            </svg>
            <span>Kick Member</span>
            }
        </button>
        }

        <!-- Cancel Button -->
        <button (click)="closeMenu()" [disabled]="isKicking()"
            class="w-full px-4 py-3 text-left text-[var(--gray)] hover:bg-[var(--dark-gray)] transition-all duration-150 flex items-center gap-2 text-sm font-family-roboto-slab disabled:opacity-50"
            [ngClass]="{'border-t border-[var(--dark-gray)]': user.userId !== currentUser()?.id && user.role.toString() !== 'ADMIN'}">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            <span>Cancel</span>
        </button>
    </div>
    }
</div>
